name: Publish Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "${GITHUB_REF_NAME} isn't the main branch's latest commit." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PLATEN="${GITHUB_REF_NAME#v}" uv build

      # Fail unless the built version is exactly the tag's. This also rejects tags
      # that aren't canonical versions, like v1.02.0 (built as 1.2.0), which the tag
      # filters above can't express.
      - run: |
          ls dist
          test -f "dist/platen-${GITHUB_REF_NAME#v}.tar.gz"

      # Install the wheel we just built (not this checkout's source) into a
      # throwaway environment, with dependencies resolved fresh from PyPI rather
      # than uv.lock, then press the task list example with the installed
      # `platen` command. The output must match the example's committed build
      # exactly.
      - run: |
          uv run --isolated --no-project \
            --with "dist/platen-${GITHUB_REF_NAME#v}-py3-none-any.whl" \
            platen \
              examples/task_list/templates \
              examples/task_list/tasks.yaml \
              "${RUNNER_TEMP}/task_list"

          diff --recursive examples/task_list/build "${RUNNER_TEMP}/task_list"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: dist
          path: dist/

  publish:
    environment:
      name: pypi
      url: https://pypi.org/p/platen

    needs: build

    permissions:
      id-token: write

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
