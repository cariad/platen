[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
]

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "rumdl>=0.2.73",
  { include-group = "docs" },
]
docs = [
  "zensical>=0.0.61",
]

[project]
authors = [
  { name = "Cariad Eccleston", email = "cariad@cariad.earth" },
]
dependencies = [
  "jinja2>=3.1.6",
  "ruamel-yaml>=0.19.1",
]
description = "Press structured data into documents"
license = "MIT"
name = "platen"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = [
  "platen",
]

[tool.pyright]
include = [
  "src",
  "tests",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov"
log_level = "DEBUG"
testpaths = [
  "tests",
]

[tool.ruff.lint]
extend-ignore = [
  "D100", # Docstrings in public modules
  "D104", # Docstrings in public packages
  "D107", # Docstrings on __init__ functions
  "D205", # One-line docstring summary followed by detail
  "D212", # Summary on the first line (we use D213 instead)
]
extend-select = [
  "D213", # Summary on the second line
]
select = [
  "ANN", # Require all type annotations
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "RUF", # ruff's own rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.rumdl]
disable = [
  "MD013", # Maximum line length
]
exclude = [
  "examples/*/templates",
]

[tool.rumdl.per-file-flavor]
"docs/**/*.md" = "mkdocs"

[tool.uv]
required-version = "~=0.12.10"
