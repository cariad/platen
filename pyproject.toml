[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.7",
  "rumdl>=0.2.73",
  { include-group = "docs" },
]
docs = [
  "zensical>=0.0.61",
]

[project]
authors = [
  { name = "Cariad Eccleston", email = "cariad@cariad.earth" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "jinja2>=3.1.6,<4",
  "mosey>=0.2.0,<0.3",
  "ruamel-yaml>=0.19.1,<0.20",
]
description = "Press structured data into documents"
dynamic = [
  "version",
]
license = "MIT"
name = "platen"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
platen = "platen.cli:main"

[project.urls]
Documentation = "https://cariad.github.io/platen/"
Issues = "https://github.com/cariad/platen/issues"
Source = "https://github.com/cariad/platen"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = [
  "platen",
]

[tool.hatch.version]
# Derive the version from git tags.
#
# `.github/workflows/release.yml` pins it to the release tag with
# `SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PLATEN`, which setuptools-scm only reads when it's
# given `dist_name`.
#
# Source trees without git metadata, like GitHub's source archives, fall back to 0.0.0
# rather than failing.
fallback-version = "0.0.0"
raw-options = { dist_name = "platen" }
source = "vcs"

[tool.pyright]
include = [
  "src",
  "tests",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov"
log_level = "DEBUG"
testpaths = [
  "tests",
]

[tool.ruff.lint]
extend-ignore = [
  "D100", # Docstrings in public modules
  "D104", # Docstrings in public packages
  "D107", # Docstrings on __init__ functions
  "D205", # One-line docstring summary followed by detail
  "D212", # Summary on the first line (we use D213 instead)
]
extend-select = [
  "D213", # Summary on the second line
]
select = [
  "ANN", # Require all type annotations
  "B",   # flake8-bugbear
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "RUF", # ruff's own rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.rumdl]
disable = [
  "MD013", # Maximum line length
]
exclude = [
  "examples/*/templates",
]

[tool.rumdl.per-file-flavor]
"docs/**/*.md" = "mkdocs"

[tool.uv]
# Rebuild the editable install when git commits or tags change, as well as when
# pyproject.toml does, so its VCS-derived version stays current.
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
required-version = "~=0.12.10"
